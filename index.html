<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>名古屋・冬之旅 (多人協作帳本版)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Noto+Sans+TC:wght@400;500;700&swap" rel="stylesheet">

    <style>
        :root {
            --bg-paper: #f9f7f2;
            --primary: #769a9e;
            --secondary: #e6a496;
            --accent: #dca856;
            --text-main: #4a4a4a;
        }

        body {
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background-color: var(--bg-paper);
            color: var(--text-main);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .handwriting { font-family: 'Yomogi', cursive; }

        .watercolor-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .nav-item.active { color: var(--primary); font-weight: bold; }
        
        /* 帳本專用樣式 */
        .expense-item { border-bottom: 1px dashed #eee; }
        .category-tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; color: white; }
        .cat-food { background: #e67e22; }
        .cat-trans { background: #3498db; }
        .cat-play { background: #27ae60; }
        .cat-other { background: #95a5a6; }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 100; backdrop-filter: blur(3px); align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
    </style>
</head>
<body class="pb-24">

    <header class="sticky top-0 z-50 bg-[#f9f7f2]/95 backdrop-blur-md px-4 py-3 shadow-sm border-b border-gray-200/50">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-[#5e8b7e]">Nagoya Ledger ❄️</h1>
            <div id="sync-status" class="text-[10px] text-gray-400 font-mono bg-white px-2 py-1 rounded-full border border-gray-100">
                <i class="fas fa-cloud"></i> 同步中...
            </div>
        </div>
    </header>

    <main>
        <section id="plan" class="tab-content active p-4">
             <div id="itinerary-placeholder" class="text-center py-10 text-gray-400">正在載入行程資料...</div>
        </section>

        <section id="ledger" class="tab-content p-4">
            <div class="text-center mb-6">
                <h2 class="text-2xl handwriting text-[#769a9e]">Travel Ledger</h2>
                <p class="text-sm text-gray-500">大家一起記，回國不吵架</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="watercolor-card p-4 border-t-4 border-[#769a9e]">
                    <div class="text-xs text-gray-400 mb-1">總支出 (JPY)</div>
                    <div class="text-xl font-bold text-[#5e8b7e] font-mono" id="total-amount">0</div>
                </div>
                <div class="watercolor-card p-4 border-t-4 border-[#e6a496]">
                    <div class="text-xs text-gray-400 mb-1">平均每人</div>
                    <div class="text-xl font-bold text-[#e6a496] font-mono" id="avg-amount">0</div>
                </div>
            </div>

            <div class="watercolor-card p-4 mb-6 bg-[#fdfbf7]">
                <h3 class="text-sm font-bold mb-3 border-b border-gray-100 pb-2"><i class="fas fa-balance-scale mr-2"></i>結算分析</h3>
                <div id="settlement-list" class="space-y-2">
                    <div class="text-center text-xs text-gray-400">輸入帳目後顯示</div>
                </div>
            </div>

            <div class="watercolor-card overflow-hidden">
                <div class="bg-white/50 p-3 border-b border-gray-100 flex justify-between items-center">
                    <span class="text-sm font-bold">消費清單</span>
                    <button onclick="openLedgerModal()" class="bg-[#769a9e] text-white text-xs px-3 py-1 rounded-full shadow-sm">
                        <i class="fas fa-plus mr-1"></i>新增帳目
                    </button>
                </div>
                <div id="ledger-list" class="max-h-[400px] overflow-y-auto">
                    </div>
            </div>
        </section>

        <section id="info" class="tab-content p-4">
             <div class="text-center py-10 text-gray-400 italic">更多資訊請參考原本版本...</div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-lg border-t border-gray-200 pb-safe pt-2 px-2 flex justify-between items-center z-50 h-[80px] rounded-t-[20px] shadow-lg">
        <button onclick="switchTab('plan')" class="nav-item active flex flex-col items-center gap-1 flex-1" id="nav-plan">
            <i class="fas fa-calendar-alt text-lg"></i><span class="text-[10px]">行程</span>
        </button>
        <button onclick="switchTab('ledger')" class="nav-item flex flex-col items-center gap-1 flex-1" id="nav-ledger">
            <i class="fas fa-calculator text-lg"></i><span class="text-[10px]">帳本</span>
        </button>
        <button onclick="switchTab('info')" class="nav-item flex flex-col items-center gap-1 flex-1" id="nav-info">
            <i class="fas fa-info-circle text-lg"></i><span class="text-[10px]">資訊</span>
        </button>
    </nav>

    <div id="ledger-modal" class="modal-overlay" onclick="closeLedgerModal(event)">
        <div class="bg-white w-full max-w-sm rounded-[25px] overflow-hidden" onclick="event.stopPropagation()">
            <div class="bg-[#769a9e] p-4 text-white text-center">
                <h3 class="font-bold">新增旅行支出</h3>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">支付者</label>
                    <select id="exp-payer" class="w-full bg-gray-50 border-0 rounded-lg p-2 text-sm focus:ring-2 ring-[#769a9e]">
                        <option value="成員A">成員A</option>
                        <option value="成員B">成員B</option>
                        <option value="成員C">成員C</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">金額 (JPY)</label>
                    <input type="number" id="exp-amount" placeholder="輸入金額" class="w-full bg-gray-50 border-0 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">項目名稱</label>
                    <input type="text" id="exp-note" placeholder="例如：炸蝦飯、地鐵票" class="w-full bg-gray-50 border-0 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">類別</label>
                    <div class="flex gap-2">
                        <label class="flex-1"><input type="radio" name="exp-cat" value="food" checked class="hidden peer"><div class="peer-checked:bg-[#e67e22] peer-checked:text-white bg-gray-100 text-gray-400 text-center py-1 rounded text-xs cursor-pointer">餐飲</div></label>
                        <label class="flex-1"><input type="radio" name="exp-cat" value="trans" class="hidden peer"><div class="peer-checked:bg-[#3498db] peer-checked:text-white bg-gray-100 text-gray-400 text-center py-1 rounded text-xs cursor-pointer">交通</div></label>
                        <label class="flex-1"><input type="radio" name="exp-cat" value="play" class="hidden peer"><div class="peer-checked:bg-[#27ae60] peer-checked:text-white bg-gray-100 text-gray-400 text-center py-1 rounded text-xs cursor-pointer">遊玩</div></label>
                    </div>
                </div>
                <button onclick="saveExpense()" class="w-full bg-[#5e8b7e] text-white py-3 rounded-xl font-bold shadow-md hover:bg-[#4a7266] transition-colors">確認送出</button>
                <button onclick="closeLedgerModal()" class="w-full text-gray-400 text-xs py-2">取消</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase 設定
        const firebaseConfig = {
          apiKey: "AIzaSyBvvQQ7uAomcA7f_QbU6r8imK5ZnA52SS4",
          authDomain: "nagoya-9ad6e.firebaseapp.com",
          projectId: "nagoya-9ad6e",
          storageBucket: "nagoya-9ad6e.firebasestorage.app",
          messagingSenderId: "731191881156",
          appId: "1:731191881156:web:11092aa985c0ddf41a8891"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tripRef = doc(db, "trips", "nagoya_2026_ledger"); // 另存到新文件，避免破壞原本清單

        let ledgerData = [];
        const members = ["成員A", "成員B", "成員C"]; // 可自行修改成員名單

        // 監聽 Firebase 資料
        onSnapshot(tripRef, (docSnap) => {
            const statusEl = document.getElementById('sync-status');
            if (docSnap.exists()) {
                ledgerData = docSnap.data().ledger || [];
                renderLedger();
                statusEl.innerHTML = '<i class="fas fa-check-circle text-green-500"></i> 已同步';
            } else {
                setDoc(tripRef, { ledger: [] });
                statusEl.innerHTML = '<i class="fas fa-info-circle text-blue-500"></i> 初始化帳本';
            }
        });

        // 保存帳目
        window.saveExpense = async function() {
            const payer = document.getElementById('exp-payer').value;
            const amount = parseFloat(document.getElementById('exp-amount').value);
            const note = document.getElementById('exp-note').value;
            const cat = document.querySelector('input[name="exp-cat"]:checked').value;

            if (!amount || !note) return alert("請填寫金額與項目！");

            const newEntry = {
                id: Date.now(),
                payer, amount, note, cat,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            ledgerData.unshift(newEntry); // 新的在前面
            try {
                await setDoc(tripRef, { ledger: ledgerData });
                closeLedgerModal();
                // 清空輸入
                document.getElementById('exp-amount').value = '';
                document.getElementById('exp-note').value = '';
            } catch (e) {
                alert("儲存失敗！");
            }
        };

        // 刪除帳目
        window.deleteExpense = async function(id) {
            if (!confirm("確定要刪除這筆帳目嗎？")) return;
            ledgerData = ledgerData.filter(item => item.id !== id);
            await setDoc(tripRef, { ledger: ledgerData });
        };

        // 渲染帳本
        function renderLedger() {
            const listContainer = document.getElementById('ledger-list');
            const totalEl = document.getElementById('total-amount');
            const avgEl = document.getElementById('avg-amount');
            const settlementEl = document.getElementById('settlement-list');

            if (ledgerData.length === 0) {
                listContainer.innerHTML = '<div class="py-10 text-center text-gray-300 text-xs">尚無支出紀錄</div>';
                return;
            }

            let total = 0;
            let paidByMember = {};
            members.forEach(m => paidByMember[m] = 0);

            // 渲染清單
            listContainer.innerHTML = ledgerData.map(item => {
                total += item.amount;
                paidByMember[item.payer] += item.amount;
                const catNames = {food:'餐飲', trans:'交通', play:'遊玩'};
                return `
                <div class="expense-item p-4 flex justify-between items-center bg-white hover:bg-gray-50">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="category-tag cat-${item.cat}">${catNames[item.cat]}</span>
                            <span class="font-bold text-sm text-gray-700">${item.note}</span>
                        </div>
                        <div class="text-[10px] text-gray-400">${item.payer} 付款 · ${item.time}</div>
                    </div>
                    <div class="text-right flex items-center gap-3">
                        <div class="font-mono font-bold text-[#5e8b7e]">¥${item.amount.toLocaleString()}</div>
                        <button onclick="deleteExpense(${item.id})" class="text-gray-200 hover:text-red-300 transition-colors">
                            <i class="fas fa-trash-alt text-xs"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');

            // 更新統計卡片
            const avg = total / members.length;
            totalEl.innerText = total.toLocaleString();
            avgEl.innerText = Math.round(avg).toLocaleString();

            // 渲染結算分析
            settlementEl.innerHTML = members.map(m => {
                const diff = paidByMember[m] - avg;
                const colorClass = diff >= 0 ? 'text-green-600' : 'text-red-500';
                const statusText = diff >= 0 ? '應收' : '應付';
                return `
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-600 font-medium">${m}</span>
                    <div class="flex gap-4">
                        <span class="text-gray-400 text-xs">已付 ¥${paidByMember[m].toLocaleString()}</span>
                        <span class="${colorClass} font-mono font-bold">${statusText} ¥${Math.abs(Math.round(diff)).toLocaleString()}</span>
                    </div>
                </div>`;
            }).join('');
        }

        // 基本導覽邏輯
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-' + tabId).classList.add('active');
        };

        window.openLedgerModal = () => document.getElementById('ledger-modal').classList.add('open');
        window.closeLedgerModal = () => document.getElementById('ledger-modal').classList.remove('open');
    </script>
</body>
</html>
